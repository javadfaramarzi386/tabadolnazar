<!--  templates/accounts/register.html  -->

{% extends 'base.html' %}

{% block title %}گزارش کاربر{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-lg-6">
        <div class="card shadow">
            <div class="card-header bg-danger text-white">
                <h5>
                    گزارش کاربر
                    <strong>@{{ reported_user.username }}</strong>
                </h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            دلیل گزارش
                            <span class="text-danger">*</span>
                        </label>
                        <textarea
                            name="reason"
                            class="form-control"
                            rows="7"
                            placeholder="توضیح کامل دلیل گزارش خود را اینجا بنویسید..."
                            required></textarea>
                        <div class="form-text">
                            لطفاً با جزئیات بنویسید تا بررسی دقیق‌تری انجام شود.
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'accounts:profile_detail' reported_user.username %}"
                           class="btn btn-secondary">
                            انصراف
                        </a>
                        <button type="submit" class="btn btn-danger">
                            ارسال گزارش
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
