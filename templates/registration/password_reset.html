<!-- templates/registration/password_reset.html -->

{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h3>
        فراموشی رمز عبور
    </h3>

    <p>
        ایمیل خود را وارد کنید تا لینک بازیابی رمز ارسال شود.
    </p>


    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-primary">
            ارسال لینک بازیابی
        </button>

    </form>

</div>

{% endblock %}
