{% extends "base.html" %}

{% block title %}رمز عبور جدید{% endblock %}

{% block content %}

<div class="container mt-5">

    <h3>انتخاب رمز عبور جدید</h3>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            ذخیره رمز عبور
        </button>
    </form>

</div>

{% endblock %}
